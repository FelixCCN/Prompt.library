<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Prompt library</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Special+Elite&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#ECE6D6;
  --paper-shadow:#DCD5BF;
  --card:#FBF8EF;
  --card-edge:#E4DEC9;
  --ink:#23281F;
  --ink-soft:#5B6152;
  --accent:#4B6B53;
  --accent-dark:#37503C;
  --mustard:#B98A2E;
  --line:#C9C0A6;
  --shadow: rgba(35,40,31,0.18);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px),
    var(--paper);
  color:var(--ink);
  font-family:'Source Serif 4', Georgia, serif;
  min-height:100vh;
}

.mono{font-family:'IBM Plex Mono', monospace;}
.type{font-family:'Special Elite', monospace;}

/* ============ HEADER ============ */
.header{
  padding:56px 24px 28px;
  text-align:center;
  border-bottom: 3px double var(--line);
  position:relative;
}
.header .eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.28em;
  text-transform:uppercase;
  color:var(--accent-dark);
  margin-bottom:10px;
}
.header h1{
  font-family:'Crimson Pro', 'Source Serif 4', serif;
  font-weight:600;
  font-style:italic;
  font-size:clamp(38px, 6vw, 60px);
  margin:0 0 10px;
  letter-spacing:0.01em;
  color:var(--ink);
}
.header p{
  margin:0 auto;
  max-width:520px;
  color:var(--ink-soft);
  font-size:16px;
  line-height:1.5;
}

/* ============ CONTROLS ============ */
.controls{
  max-width:1100px;
  margin:0 auto;
  padding:28px 24px 8px;
}
.search-row{
  display:flex;
  justify-content:center;
  margin-bottom:20px;
}
.search-box{
  width:100%;
  max-width:480px;
  position:relative;
}
.search-box input{
  width:100%;
  padding:12px 16px 12px 40px;
  border:1.5px solid var(--line);
  background:var(--card);
  border-radius:2px;
  font-family:'IBM Plex Mono', monospace;
  font-size:14px;
  color:var(--ink);
  outline:none;
  box-shadow: inset 0 1px 3px rgba(35,40,31,0.08);
}
.search-box input:focus{
  border-color:var(--accent);
}
.search-box::before{
  content:"⌕";
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:var(--ink-soft);
  font-size:16px;
}
.search-box input::placeholder{color:#9A9682;}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
}
.tab{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:0.04em;
  text-transform:uppercase;
  padding:8px 14px;
  background:var(--card);
  border:1.5px solid var(--card-edge);
  border-bottom:3px solid var(--card-edge);
  border-radius:2px 2px 0 0;
  cursor:pointer;
  color:var(--ink-soft);
  transition:all 0.15s ease;
  user-select:none;
}
.tab:hover{ color:var(--ink); border-color:var(--line); }
.tab.active{
  background:var(--accent);
  border-color:var(--accent-dark);
  border-bottom-color:var(--mustard);
  color:#F8F5EA;
}
.tab .count{ opacity:0.65; margin-left:4px; }
.tab-edit{
  margin-left:6px;
  opacity:0.6;
  font-size:11px;
}
.tab-edit:hover{ opacity:1; }
.tab-delete{
  margin-left:4px;
  opacity:0.6;
  font-size:11px;
}
.tab-delete:hover{ opacity:1; color:#A13B2E; }
.tab-add{
  background:transparent;
  border-style:dashed;
  color:var(--accent-dark);
}
.tab-add:hover{ background:var(--card); }

.results-meta{
  max-width:1100px;
  margin:18px auto 6px;
  padding:0 24px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:var(--ink-soft);
  text-align:center;
}

/* ============ GRID ============ */
.grid{
  max-width:1100px;
  margin:0 auto;
  padding:20px 24px 80px;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:22px;
}

.card{
  background:var(--card);
  border:1px solid var(--card-edge);
  border-radius:2px;
  padding:18px 18px 16px;
  position:relative;
  box-shadow: 2px 3px 0 var(--card-edge), 0 6px 14px var(--shadow);
  display:flex;
  flex-direction:column;
  min-height:230px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.card:hover{
  transform:translateY(-2px);
  box-shadow: 2px 4px 0 var(--card-edge), 0 10px 20px var(--shadow);
}
.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:1px dashed var(--line);
  padding-bottom:8px;
  margin-bottom:10px;
}
.card-cat{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--accent-dark);
}
.card-no{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  color:var(--ink-soft);
}
.fav-btn{
  background:none;
  border:none;
  cursor:pointer;
  font-size:17px;
  line-height:1;
  color:var(--line);
  padding:0;
  margin-left:10px;
  transition:color 0.15s ease, transform 0.15s ease;
}
.fav-btn.active{ color:var(--mustard); transform:scale(1.1); }
.fav-btn:hover{ color:var(--mustard); }

.card-title{
  font-family:'Crimson Pro', 'Source Serif 4', serif;
  font-weight:600;
  font-size:19px;
  margin:0 0 8px;
  line-height:1.3;
  color:var(--ink);
}
.card-body{
  font-size:14px;
  line-height:1.5;
  color:var(--ink-soft);
  flex-grow:1;
  margin-bottom:12px;
  display:-webkit-box;
  -webkit-line-clamp:5;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.card-tags{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  color:var(--ink-soft);
  margin-bottom:12px;
}
.card-tags b{ color:var(--accent-dark); font-weight:600; }

.card-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  position:relative;
}
.copy-btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:0.05em;
  text-transform:uppercase;
  padding:8px 14px;
  background:var(--accent);
  color:#F8F5EA;
  border:1px solid var(--accent-dark);
  border-radius:2px;
  cursor:pointer;
  transition:background 0.15s ease;
}
.copy-btn:hover{ background:var(--accent-dark); }
.expand-btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
  background:none;
  border:none;
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:2px;
}

/* stamp animation */
.stamp{
  position:absolute;
  right:8px;
  top:-46px;
  font-family:'Special Elite', monospace;
  font-size:15px;
  color:#A13B2E;
  border:2.5px solid #A13B2E;
  padding:3px 10px;
  border-radius:4px;
  transform:rotate(-11deg) scale(1.5);
  opacity:0;
  pointer-events:none;
  letter-spacing:0.06em;
  text-transform:uppercase;
  background:rgba(251,248,239,0.9);
}
.stamp.show{
  animation: stampIn 1.3s ease forwards;
}
@keyframes stampIn{
  0%{ opacity:0; transform:rotate(-11deg) scale(1.8); }
  15%{ opacity:1; transform:rotate(-11deg) scale(1); }
  75%{ opacity:1; transform:rotate(-11deg) scale(1); }
  100%{ opacity:0; transform:rotate(-11deg) scale(1); }
}

/* card modal */
.overlay{
  position:fixed; inset:0;
  background:rgba(35,40,31,0.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  z-index:50;
}
.overlay.show{ display:flex; }
.modal{
  background:var(--card);
  max-width:560px;
  width:100%;
  padding:28px;
  border-radius:2px;
  border:1px solid var(--card-edge);
  box-shadow:0 20px 50px rgba(0,0,0,0.3);
  max-height:80vh;
  overflow-y:auto;
}
.modal-close{
  float:right;
  background:none;
  border:none;
  font-size:20px;
  cursor:pointer;
  color:var(--ink-soft);
  line-height:1;
}
.modal h2{
  font-family:'Crimson Pro', 'Source Serif 4', serif;
  font-weight:600;
  margin:6px 0 14px;
  font-size:23px;
}
.modal .card-body{
  -webkit-line-clamp:unset;
  overflow:visible;
  font-size:15px;
  white-space:pre-wrap;
}
.modal .modal-actions{
  margin-top:18px;
  display:flex;
  gap:10px;
}

.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-soft);
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
}

footer{
  text-align:center;
  padding:24px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  color:var(--ink-soft);
  border-top:1px solid var(--line);
}

/* ============ ADMIN ============ */
.admin-bar{
  max-width:1100px;
  margin:0 auto;
  padding:0 24px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:14px;
}
.admin-link{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
  background:none;
  border:none;
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:2px;
  padding:4px 0;
}
.admin-link:hover{ color:var(--accent-dark); }
.admin-badge{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--accent-dark);
  background:#E4E9DD;
  border:1px solid var(--accent);
  padding:3px 8px;
  border-radius:2px;
}
.add-btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:0.04em;
  text-transform:uppercase;
  padding:9px 16px;
  background:var(--mustard);
  color:#2A2110;
  border:1px solid #8E6A20;
  border-radius:2px;
  cursor:pointer;
  margin:4px auto 0;
  display:block;
}
.add-btn:hover{ background:#A87D28; }
.delete-btn{
  background:none;
  border:none;
  cursor:pointer;
  font-size:14px;
  line-height:1;
  color:var(--line);
  padding:0;
  margin-left:8px;
}
.delete-btn:hover{ color:#A13B2E; }

.form-field{ margin-bottom:14px; text-align:left; }
.form-field label{
  display:block;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--ink-soft);
  margin-bottom:5px;
}
.form-field input[type="text"],
.form-field select,
.form-field textarea{
  width:100%;
  padding:10px 12px;
  border:1.5px solid var(--line);
  background:#fff;
  border-radius:2px;
  font-family:'Source Serif 4', serif;
  font-size:14px;
  color:var(--ink);
  outline:none;
}
#firsta{color:#a11f05;}
.form-field textarea{ min-height:110px; resize:vertical; font-family:'IBM Plex Mono', monospace; font-size:13px; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus{ border-color:var(--accent); }
.form-error{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:#A13B2E;
  margin-top:-6px;
  margin-bottom:12px;
}

@media (max-width:480px){
  .header{ padding:40px 16px 22px; }
  .grid{ grid-template-columns:1fr; }
}
</style>
</head>

const PROMPTS_SEED = [

let state = {
  activeTab: "All",
  query: "",
  favorites: [],
  prompts: [],
  categories: [],
  isAdmin: false
};

const grid = document.getElementById('grid');
const tabsEl = document.getElementById('tabs');
const searchInput = document.getElementById('searchInput');
const resultsMeta = document.getElementById('resultsMeta');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const adminBar = document.getElementById('adminBar');
const addBtnSlot = document.getElementById('addBtnSlot');

function getCategories(){
  // Categories are stored explicitly now (so empty ones can exist),
  // but we still fold in any category found on a prompt just in case.
  const cats = state.categories.slice();
  state.prompts.forEach(p => { if(!cats.includes(p.cat)) cats.push(p.cat); });
  return ["All", ...cats, "Favorites"];
}

function deriveCategoriesFromPrompts(){
  const seen = [];
  state.prompts.forEach(p => { if(!seen.includes(p.cat)) seen.push(p.cat); });
  return seen;
}

// ---- Prompts now live in Firestore so every visitor sees the same
// catalog, and your admin edits persist across refreshes and devices. ----
function subscribeToPrompts(){
  CATALOG_DOC.onSnapshot(async (docSnap) => {
    if(docSnap.exists && docSnap.data().list){
      const data = docSnap.data();
      state.prompts = data.list;
      if(data.categories && data.categories.length){
        state.categories = data.categories;
      } else {
        // One-time migration: older data didn't store categories
        // separately, so derive them once and save the new field.
        state.categories = deriveCategoriesFromPrompts();
        try{ await CATALOG_DOC.set({ list: state.prompts, categories: state.categories }); }
        catch(e){ console.error('Could not migrate categories', e); }
      }
    } else {
      // First run: nothing in Firestore yet, seed it with the defaults.
      state.prompts = PROMPTS_SEED.slice();
      state.categories = deriveCategoriesFromPrompts();
      try{ await CATALOG_DOC.set({ list: state.prompts, categories: state.categories }); }
      catch(e){ console.error('Could not seed catalog', e); }
    }
    render();
  }, (err) => {
    console.error('Firestore read failed — check your firebaseConfig and security rules.', err);
    if(state.prompts.length === 0){
      state.prompts = PROMPTS_SEED.slice();
      state.categories = deriveCategoriesFromPrompts();
      render();
    }
  });
}

async function savePrompts(){
  try{ await CATALOG_DOC.set({ list: state.prompts, categories: state.categories }); }
  catch(e){
    console.error('Could not save prompts to Firestore', e);
    alert("Couldn't save to the database. Check that you're signed in and your Firestore rules allow writes.");
  }
}

// ---- Favorites stay local to each visitor's browser. Uses the Claude
// artifact storage API when available (for previewing here), and falls
// back to localStorage once this is hosted as a normal website. ----
async function loadFavorites(){
  try{
    if(window.storage){
      const res = await window.storage.get('favorites', false);
      if(res && res.value){ state.favorites = JSON.parse(res.value); return; }
    }
  }catch(e){ /* fall through to localStorage */ }
  try{
    const raw = localStorage.getItem('promptCatalogFavorites');
    if(raw){ state.favorites = JSON.parse(raw); }
  }catch(e){ state.favorites = []; }
}

async function saveFavorites(){
  try{
    if(window.storage){
      await window.storage.set('favorites', JSON.stringify(state.favorites), false);
      return;
    }
  }catch(e){ /* fall through to localStorage */ }
  try{ localStorage.setItem('promptCatalogFavorites', JSON.stringify(state.favorites)); }
  catch(e){ console.error('Could not save favorites', e); }
}

async function init(){
  await loadFavorites();
  subscribeToPrompts();
  auth.onAuthStateChanged(user => {
    state.isAdmin = !!user;
    renderAdminBar();
    render();
  });
}

async function saveFavorites(){
  try{
    await window.storage.set('favorites', JSON.stringify(state.favorites), false);
  }catch(e){
    console.error('Could not save favorites', e);
  }
}

function toggleFavorite(id){
  const idx = state.favorites.indexOf(id);
  if(idx === -1){ state.favorites.push(id); }
  else { state.favorites.splice(idx,1); }
  saveFavorites();
  render();
}

function categoryCount(cat){
  if(cat === "All") return state.prompts.length;
  if(cat === "Favorites") return state.favorites.length;
  return state.prompts.filter(p => p.cat === cat).length;
}

function renderTabs(){
  tabsEl.innerHTML = '';
  getCategories().forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (state.activeTab === cat ? ' active' : '');
    const canEdit = state.isAdmin && cat !== "All" && cat !== "Favorites";
    btn.innerHTML = `${cat === "Favorites" ? "★ " : ""}${cat} <span class="count">${categoryCount(cat)}</span>${canEdit ? ` <span class="tab-edit" data-cat="${cat}" title="Rename this category">✎</span><span class="tab-delete" data-cat="${cat}" title="Delete this category">✕</span>` : ''}`;
    btn.onclick = (e) => {
      if(e.target.classList.contains('tab-edit')){
        e.stopPropagation();
        openEditCategoryModal(e.target.dataset.cat);
        return;
      }
      if(e.target.classList.contains('tab-delete')){
        e.stopPropagation();
        deleteCategory(e.target.dataset.cat);
        return;
      }
      state.activeTab = cat;
      render();
    };
    tabsEl.appendChild(btn);
  });
  if(state.isAdmin){
    const addBtn = document.createElement('button');
    addBtn.className = 'tab tab-add';
    addBtn.textContent = '+ Category';
    addBtn.onclick = () => openAddCategoryModal();
    tabsEl.appendChild(addBtn);
  }
}

function deleteCategory(cat){
  const count = state.prompts.filter(p => p.cat === cat).length;
  const msg = count > 0
    ? `"${cat}" has ${count} prompt${count === 1 ? '' : 's'} in it. Deleting the category will move ${count === 1 ? 'it' : 'them'} to "Uncategorized" — they won't be deleted. Continue?`
    : `Delete the empty category "${cat}"?`;
  if(!confirm(msg)) return;
  if(count > 0){
    state.prompts = state.prompts.map(p => p.cat === cat ? { ...p, cat: "Uncategorized" } : p);
    if(!state.categories.includes("Uncategorized")){ state.categories.push("Uncategorized"); }
  }
  state.categories = state.categories.filter(c => c !== cat);
  if(state.activeTab === cat){ state.activeTab = "All"; }
  savePrompts();
  render();
}

function getFiltered(){
  let list = state.prompts;
  if(state.activeTab === "Favorites"){
    list = list.filter(p => state.favorites.includes(p.id));
  } else if(state.activeTab !== "All"){
    list = list.filter(p => p.cat === state.activeTab);
  }
  if(state.query.trim()){
    const q = state.query.trim().toLowerCase();
    list = list.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.body.toLowerCase().includes(q) ||
      p.cat.toLowerCase().includes(q)
    );
  }
  return list;
}

function getCategoryNumberMap(){
  const map = {};
  const counters = {};
  // Sort by id so numbering stays stable and in catalog order within each category
  const sorted = state.prompts.slice().sort((a, b) => a.id - b.id);
  sorted.forEach(p => {
    counters[p.cat] = (counters[p.cat] || 0) + 1;
    map[p.id] = counters[p.cat];
  });
  return map;
}

function cardHTML(p, idx){
  const isFav = state.favorites.includes(p.id);
  const num = String(categoryNumberMap[p.id] || 0).padStart(3,'0');
  return `
    <div class="card" data-id="${p.id}">
      <div class="card-top">
        <span class="card-cat">${p.cat}</span>
        <span class="card-no">No. ${num}</span>
        <button class="fav-btn ${isFav ? 'active' : ''}" data-action="fav" data-id="${p.id}" title="Save to favorites">${isFav ? '★' : '☆'}</button>
        ${state.isAdmin ? `<button class="delete-btn" data-action="edit" data-id="${p.id}" title="Edit this prompt">✎</button>` : ''}
        ${state.isAdmin ? `<button class="delete-btn" data-action="delete" data-id="${p.id}" title="Delete this prompt">✕</button>` : ''}
      </div>
      <h3 class="card-title">${p.title}</h3>
      <div class="card-body">${escapeHTML(p.body)}</div>
      <div class="card-tags"><b>Best for:</b> ${p.models}</div>
      <div class="card-footer">
        <button class="copy-btn" data-action="copy" data-id="${p.id}">Copy prompt</button>
        <button class="expand-btn" data-action="expand" data-id="${p.id}">Read full card</button>
        <span class="stamp" id="stamp-${p.id}">Copied</span>
      </div>
    </div>
  `;
}

function escapeHTML(str){
  const div = document.createElement('div');
  div.innerText = str;
  return div.innerHTML;
}

function escapeAttr(str){
  return escapeHTML(str).replace(/"/g, '&quot;');
}

let categoryNumberMap = {};

function render(){
  renderTabs();
  renderAdminBar();
  categoryNumberMap = getCategoryNumberMap();
  const filtered = getFiltered();
  resultsMeta.textContent = `${filtered.length} ${filtered.length === 1 ? 'entry' : 'entries'} on file`;
  addBtnSlot.innerHTML = state.isAdmin ? `<button class="add-btn" id="openAddBtn">+ Add a new prompt</button>` : '';
  if(state.isAdmin){
    document.getElementById('openAddBtn').onclick = openAddModal;
  }
  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Nothing filed under that search. Try a different term or category.</div>`;
    return;
  }
  grid.innerHTML = filtered.map(cardHTML).join('');
}

function renderAdminBar(){
  if(state.isAdmin){
    adminBar.innerHTML = `<span class="admin-badge">Admin mode</span><button class="admin-link" id="signOutBtn">Sign out</button>`;
    document.getElementById('signOutBtn').onclick = () => { auth.signOut(); };
  } else {
    adminBar.innerHTML = `<button class="admin-link" id="adminSignInBtn">Library admin</button>`;
    document.getElementById('adminSignInBtn').onclick = openLoginModal;
  }
}

grid.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  const id = parseInt(btn.dataset.id);
  const action = btn.dataset.action;
  const prompt = state.prompts.find(p => p.id === id);
  if(action === 'fav'){
    toggleFavorite(id);
  } else if(action === 'copy'){
    copyPrompt(prompt);
  } else if(action === 'expand'){
    openModal(prompt);
  } else if(action === 'edit'){
    openEditPromptModal(prompt);
  } else if(action === 'delete'){
    deletePrompt(id);
  }
});

function deletePrompt(id){
  const prompt = state.prompts.find(p => p.id === id);
  if(!prompt) return;
  if(!confirm(`Delete "${prompt.title}" from the catalog? This can't be undone.`)) return;
  state.prompts = state.prompts.filter(p => p.id !== id);
  state.favorites = state.favorites.filter(fid => fid !== id);
  savePrompts();
  saveFavorites();
  render();
}

function copyPrompt(prompt){
  navigator.clipboard.writeText(prompt.body).then(() => {
    const stamp = document.getElementById(`stamp-${prompt.id}`);
    if(stamp){
      stamp.classList.remove('show');
      void stamp.offsetWidth; // restart animation
      stamp.classList.add('show');
    }
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = prompt.body;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

function openModal(prompt){
  const isFav = state.favorites.includes(prompt.id);
  modal.innerHTML = `
    <button class="modal-close" id="modalClose">&times;</button>
  <span class="card-cat">${prompt.cat} · No. ${String(categoryNumberMap[prompt.id] || 0).padStart(3,'0')}</span>
    <h2>${prompt.title}</h2>
    <div class="card-body">${escapeHTML(prompt.body)}</div>
    <div class="card-tags"><b>Best for:</b> ${prompt.models}</div>
    <div class="modal-actions">
      <button class="copy-btn" id="modalCopy">Copy prompt</button>
      <button class="fav-btn ${isFav ? 'active' : ''}" id="modalFav" style="font-size:22px;">${isFav ? '★' : '☆'}</button>
      ${state.isAdmin ? `<button class="admin-link" id="modalEdit">Edit</button>` : ''}
    </div>
  `;
  overlay.classList.add('show');
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalCopy').onclick = () => copyPrompt(prompt);
  document.getElementById('modalFav').onclick = () => { toggleFavorite(prompt.id); closeModal(); };
  if(state.isAdmin){
    document.getElementById('modalEdit').onclick = () => openEditPromptModal(prompt);
  }
}

function closeModal(){
  overlay.classList.remove('show');
}

function openLoginModal(){
  modal.innerHTML = `
    <button class="modal-close" id="modalClose">&times;</button>
    <h2>Library admin</h2>
    <div class="form-field">
      <label for="emailInput">Email</label>
      <input type="text" id="emailInput" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="form-field">
      <label for="pwInput">Password</label>
      <input type="password" id="pwInput" placeholder="Your Firebase account password" autocomplete="current-password">
    </div>
    <div class="form-error" id="pwError" style="display:none;">Couldn't sign in. Check your email and password.</div>
    <div class="modal-actions">
      <button class="copy-btn" id="pwSubmit">Sign in</button>
    </div>
  `;
  overlay.classList.add('show');
  document.getElementById('modalClose').onclick = closeModal;
  const emailInput = document.getElementById('emailInput');
  const pwInput = document.getElementById('pwInput');
  const submit = () => {
    document.getElementById('pwError').style.display = 'none';
    auth.signInWithEmailAndPassword(emailInput.value.trim(), pwInput.value)
      .then(() => closeModal())
      .catch((err) => {
        console.error(err);
        document.getElementById('pwError').style.display = 'block';
      });
  };
  document.getElementById('pwSubmit').onclick = submit;
  pwInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
  emailInput.focus();
}

function openAddModal(){
  const existingCats = state.categories.slice();
  modal.innerHTML = `
    <button class="modal-close" id="modalClose">&times;</button>
    <h2>File a new prompt</h2>
    <div class="form-field">
      <label for="fTitle">Title</label>
      <input type="text" id="fTitle" placeholder="e.g. Tighten this paragraph">
    </div>
    <div class="form-field">
      <label for="fCat">Category</label>
      <select id="fCat">
        ${existingCats.map(c => `<option value="${c}">${c}</option>`).join('')}
        <option value="__new__">+ New category…</option>
      </select>
    </div>
    <div class="form-field" id="fNewCatField" style="display:none;">
      <label for="fNewCat">New category name</label>
      <input type="text" id="fNewCat" placeholder="e.g. Video">
    </div>
    <div class="form-field">
      <label for="fBody">Prompt text</label>
      <textarea id="fBody" placeholder="Write the full prompt here. Use [brackets] for parts the user should fill in."></textarea>
    </div>
    <div class="form-field">
      <label for="fModels">Best for (optional)</label>
      <input type="text" id="fModels" placeholder="e.g. Claude, ChatGPT">
    </div>
    <div class="form-error" id="addError" style="display:none;">Please add at least a title and prompt text.</div>
    <div class="modal-actions">
      <button class="copy-btn" id="addSubmit">Add to catalog</button>
    </div>
  `;
  overlay.classList.add('show');
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('fCat').addEventListener('change', (e) => {
    document.getElementById('fNewCatField').style.display = e.target.value === '__new__' ? 'block' : 'none';
  });
  document.getElementById('addSubmit').onclick = () => {
    const title = document.getElementById('fTitle').value.trim();
    const body = document.getElementById('fBody').value.trim();
    const models = document.getElementById('fModels').value.trim() || 'Any AI assistant';
    let cat = document.getElementById('fCat').value;
    if(cat === '__new__'){
      cat = document.getElementById('fNewCat').value.trim() || 'Uncategorized';
    }
    if(!title || !body){
      document.getElementById('addError').style.display = 'block';
      return;
    }
    if(!state.categories.includes(cat)){ state.categories.push(cat); }
    const newId = state.prompts.length ? Math.max(...state.prompts.map(p => p.id)) + 1 : 1;
    state.prompts.push({ id: newId, cat, title, body, models });
    savePrompts();
    closeModal();
    state.activeTab = cat;
    render();
  };
}

function openEditPromptModal(prompt){
  const existingCats = state.categories.slice();
  if(!existingCats.includes(prompt.cat)){ existingCats.push(prompt.cat); }
  modal.innerHTML = `
    <button class="modal-close" id="modalClose">&times;</button>
    <h2>Edit prompt</h2>
    <div class="form-field">
      <label for="fTitle">Title</label>
      <input type="text" id="fTitle" value="${escapeAttr(prompt.title)}">
    </div>
    <div class="form-field">
      <label for="fCat">Category</label>
      <select id="fCat">
        ${existingCats.map(c => `<option value="${escapeAttr(c)}" ${c === prompt.cat ? 'selected' : ''}>${c}</option>`).join('')}
        <option value="__new__">+ New category…</option>
      </select>
    </div>
    <div class="form-field" id="fNewCatField" style="display:none;">
      <label for="fNewCat">New category name</label>
      <input type="text" id="fNewCat" placeholder="e.g. Video">
    </div>
    <div class="form-field">
      <label for="fBody">Prompt text</label>
      <textarea id="fBody">${escapeHTML(prompt.body)}</textarea>
    </div>
    <div class="form-field">
      <label for="fModels">Best for (optional)</label>
      <input type="text" id="fModels" value="${escapeAttr(prompt.models)}">
    </div>
    <div class="form-error" id="editError" style="display:none;">Please add at least a title and prompt text.</div>
    <div class="modal-actions">
      <button class="copy-btn" id="editSubmit">Save changes</button>
    </div>
  `;
  overlay.classList.add('show');
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('fCat').addEventListener('change', (e) => {
    document.getElementById('fNewCatField').style.display = e.target.value === '__new__' ? 'block' : 'none';
  });
  document.getElementById('editSubmit').onclick = () => {
    const title = document.getElementById('fTitle').value.trim();
    const body = document.getElementById('fBody').value.trim();
    const models = document.getElementById('fModels').value.trim() || 'Any AI assistant';
    let cat = document.getElementById('fCat').value;
    if(cat === '__new__'){
      cat = document.getElementById('fNewCat').value.trim() || 'Uncategorized';
    }
    if(!title || !body){
      document.getElementById('editError').style.display = 'block';
      return;
    }
    if(!state.categories.includes(cat)){ state.categories.push(cat); }
    state.prompts = state.prompts.map(p => p.id === prompt.id ? { ...p, title, body, models, cat } : p);
    savePrompts();
    closeModal();
    state.activeTab = cat;
    render();
  };
}

function openEditCategoryModal(oldCat){
  modal.innerHTML = `
    <button class="modal-close" id="modalClose">&times;</button>
    <h2>Rename category</h2>
    <div class="form-field">
      <label for="catNewName">New name for "${oldCat}"</label>
      <input type="text" id="catNewName" value="${oldCat}">
    </div>
    <div class="form-error" id="catError" style="display:none;">Please enter a category name.</div>
    <div class="modal-actions">
      <button class="copy-btn" id="catSubmit">Save</button>
    </div>
  `;
  overlay.classList.add('show');
  document.getElementById('modalClose').onclick = closeModal;
  const input = document.getElementById('catNewName');
  const submit = () => {
    const newCat = input.value.trim();
    if(!newCat){
      document.getElementById('catError').style.display = 'block';
      return;
    }
    if(newCat === oldCat){ closeModal(); return; }
    // Renaming updates every prompt currently filed under the old category.
    // If newCat matches an existing category, the two are merged.
    state.prompts = state.prompts.map(p => p.cat === oldCat ? { ...p, cat: newCat } : p);
    state.categories = state.categories.filter(c => c !== oldCat);
    if(!state.categories.includes(newCat)){ state.categories.push(newCat); }
    savePrompts();
    if(state.activeTab === oldCat){ state.activeTab = newCat; }
    closeModal();
    render();
  };
  document.getElementById('catSubmit').onclick = submit;
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
  input.focus();
  input.select();
}

function openAddCategoryModal(){
  modal.innerHTML = `
    <button class="modal-close" id="modalClose">&times;</button>
    <h2>Add a new category</h2>
    <div class="form-field">
      <label for="newCatName">Category name</label>
      <input type="text" id="newCatName" placeholder="e.g. Video">
    </div>
    <div class="form-error" id="newCatError" style="display:none;">Please enter a name — and make sure it doesn't already exist.</div>
    <div class="modal-actions">
      <button class="copy-btn" id="newCatSubmit">Add category</button>
    </div>
  `;
  overlay.classList.add('show');
  document.getElementById('modalClose').onclick = closeModal;
  const input = document.getElementById('newCatName');
  const submit = () => {
    const name = input.value.trim();
    if(!name || getCategories().includes(name)){
      document.getElementById('newCatError').style.display = 'block';
      return;
    }
    state.categories.push(name);
    savePrompts();
    state.activeTab = name;
    closeModal();
    render();
  };
  document.getElementById('newCatSubmit').onclick = submit;
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
  input.focus();
}

overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

searchInput.addEventListener('input', (e) => {
  state.query = e.target.value;
  render();
});

init();
</script>
